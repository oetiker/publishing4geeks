# Build the slides with the real tools and publish them on GitHub Pages:
# https://oetiker.github.io/publishing4geeks/
name: Build and publish slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TYPST_VERSION: 0.15.1
      MDMOST_VERSION: 0.4.0
    steps:
      - uses: actions/checkout@v7

      - name: Install LaTeX and pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-fonts-recommended texlive-extra-utils ghostscript pandoc

      - name: Install Typst
        run: |
          curl -sSfL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/

      - name: Install mdmost
        run: |
          mkdir -p "$RUNNER_TEMP/mdmost"
          curl -sSfL "https://github.com/oetiker/mdmost/releases/download/v${MDMOST_VERSION}/mdmost-${MDMOST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/mdmost"
          sudo install "$(find "$RUNNER_TEMP/mdmost" -type f -name mdmost)" /usr/local/bin/

      - name: Show tool versions
        run: |
          typst --version
          mdmost --version
          pandoc --version | head -1
          latexmk --version | head -2 | tail -1
          google-chrome --version

      - name: Build the slides and the site
        run: make site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
